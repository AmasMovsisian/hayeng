<main class="goal">
  <section class="goal__content">
    @if (currentStep === 1 || currentStep === 2) {
      <app-goal-questions
        [currentStep]="currentStep"
        [selectedGoal]="selectedGoal"
        [selectedLevel]="selectedLevel"
        [placementTestStatus]="placementTestStatus"
        (goalSelected)="selectGoal($event)"
        (levelSelected)="selectLevel($event)"
        (unknownLevelSelected)="selectUnknownLevel()"
        (placementStart)="startPlacementTest()"
        (placementSkip)="skipPlacementTest()"
        (placementLater)="laterPlacementTest()"
        (next)="nextStep()"
        (back)="previousStep()"
      />
    }

    @if (currentStep === 3) {
      <app-goal-profile
        [username]="username"
        [dateOfBirth]="dateOfBirth"
        [usernameTouched]="usernameTouched"
        [dateOfBirthTouched]="dateOfBirthTouched"
        [usernameValid]="isUsernameValid()"
        [ageValid]="isAgeValid()"
        [usernameError]="getUsernameError()"
        [dateOfBirthError]="getDateOfBirthError()"
        (usernameInput)="onUsernameInput($event)"
        (usernameBlur)="onUsernameBlur()"
        (dateOfBirthChange)="onDateOfBirthChange($event)"
        (dateOfBirthBlur)="onDateOfBirthBlur()"
        (next)="nextStep()"
        (back)="previousStep()"
      />
    }

    @if (currentStep === 4) {
      <app-goal-welcome
        [username]="username"
        (next)="nextStep()"
      />
    }

    @if (currentStep === 5) {
      <app-goal-register
        [email]="email"
        [password]="password"
        [passwordConfirm]="passwordConfirm"
        [registrationValid]="isRegistrationValid()"
        (emailChange)="email = $event"
        (passwordChange)="password = $event"
        (passwordConfirmChange)="passwordConfirm = $event"
        (googleRegister)="registerWithGoogle()"
        (register)="register()"
        (back)="previousStep()"
      />
    }
  </section>
</main>
