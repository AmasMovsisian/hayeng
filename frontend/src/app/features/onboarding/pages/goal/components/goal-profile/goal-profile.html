<div class="goal__step-wrapper">
  <header class="goal__header">
    <div
      class="goal__progress"
      role="progressbar"
      aria-valuemin="1"
      aria-valuemax="4"
      aria-valuenow="3"
      aria-label="Քայլ 3 4-ից"
    >
      <div class="goal__progress-meta">
        <span class="goal__progress-label">
          ՔԱՅԼ 3
        </span>
        <span class="goal__progress-count">
          3 / 4
        </span>
      </div>
      <div
        class="goal__progress-track"
        aria-hidden="true"
      >
        <span class="goal__progress-fill goal__progress-fill--three-quarter"></span>
      </div>
    </div>
    <div class="goal__heading">
      <span class="goal__eyebrow">
        Մի փոքր էլ քեզ մասին
      </span>
      <h1 class="goal__title">
        Ինչպե՞ս կարող ենք քեզ
        <span>ավելի լավ ճանաչել։</span>
      </h1>
      <p class="goal__subtitle">
        Մի քանի տվյալ ևս, և կկարողանանք ավելի անձնական դարձնել քո ուսուցումը։
      </p>
    </div>
  </header>
  <div class="goal__form">
    <label
      class="goal__field"
      [class.goal__field--error]="usernameTouched && !usernameValid"
    >
      <span class="goal__label-row">
        <span class="goal__label">
          Անուն
        </span>
        <span class="goal__optional">
          Անձնական
        </span>
      </span>
      <span class="goal__input-shell">
        <span
          class="goal__input-leading"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" focusable="false">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.8-3.1 3.2-5 7-5s6.2 1.9 7 5"></path>
          </svg>
        </span>
        <input
          type="text"
          class="goal__input"
          name="name"
          autocomplete="name"
          placeholder="Քո անունը"
          [value]="username"
          (input)="onUsernameInput($any($event.target).value)"
          (blur)="usernameBlur.emit()"
          aria-label="Քո անունը"
        />
      </span>
      <p
        class="goal__field-error"
        [class.goal__field-error--visible]="usernameTouched && !usernameValid"
        aria-live="polite"
      >
        {{ usernameError || '&nbsp;' }}
      </p>
    </label>
    <label
      class="goal__field"
      [class.goal__field--error]="dateOfBirthTouched && !ageValid"
    >
      <span class="goal__label-row">
        <span class="goal__label">
          Ծննդյան ամսաթիվ
        </span>
        <span class="goal__optional">
          Օր / Ամիս / Տարի
        </span>
      </span>
      <span class="goal__date-wrapper">
        <span
          class="goal__input-leading goal__date-leading"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7 2v3M17 2v3M3.5 9.5h17"></path>
            <path d="M5.5 4.5h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2Z"></path>
          </svg>
        </span>
        <input
          type="text"
          class="goal__input goal__date-input"
          name="dateOfBirth"
          autocomplete="bday"
          inputmode="numeric"
          maxlength="10"
          placeholder="Օր / Ամիս / Տարի"
          [value]="dateInputValue"
          (input)="onDateInput($any($event.target).value)"
          (blur)="onDateBlur()"
          aria-label="Ծննդյան ամսաթիվ"
          aria-describedby="date-of-birth-error"
        />
        <span class="goal__calendar-button" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7 2v3M17 2v3M3.5 9.5h17"></path>
            <path d="M5.5 4.5h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2Z"></path>
          </svg>
        </span>
        <input
          #nativeDateInput
          type="date"
          class="goal__native-date"
          name="nativeDateOfBirth"
          aria-label="Ընտրել ծննդյան ամսաթիվը"
          [value]="dateOfBirth"
          (change)="onNativeDateChange($any($event.target).value)"
        />
      </span>
      <p
        id="date-of-birth-error"
        class="goal__field-error"
        [class.goal__field-error--visible]="dateOfBirthTouched && !ageValid"
        aria-live="polite"
      >
        {{ dateOfBirthError || '&nbsp;' }}
      </p>
    </label>
    <div
      class="goal__field goal__gender-field"
      [class.goal__field--error]="genderTouched && !genderValid"
    >
      <div class="goal__label-row">
        <span class="goal__label">
          Սեռ
        </span>
        <span class="goal__optional">
          Ընտրիր մեկը
        </span>
      </div>
      <div
        class="goal__gender-options"
        role="radiogroup"
        aria-label="Ընտրիր քո սեռը"
      >
        <button
          type="button"
          class="goal__gender-option"
          [class.goal__gender-option--active]="gender === 'male'"
          [attr.aria-checked]="gender === 'male'"
          role="radio"
          (click)="onGenderChange('male')"
          (blur)="genderBlur.emit()"
        >
          <span class="goal__gender-icon" aria-hidden="true">
            ♂
          </span>
          <span class="goal__gender-content">
            <span class="goal__gender-title">
              Արական
            </span>
            <span class="goal__gender-description">
              Տղամարդ
            </span>
          </span>
          <span
            class="goal__gender-check"
            [class.goal__gender-check--visible]="gender === 'male'"
            aria-hidden="true"
          >
            <svg viewBox="0 0 20 20" focusable="false">
              <path d="m5 10 3 3 7-7"></path>
            </svg>
          </span>
        </button>
        <button
          type="button"
          class="goal__gender-option"
          [class.goal__gender-option--active]="gender === 'female'"
          [attr.aria-checked]="gender === 'female'"
          role="radio"
          (click)="onGenderChange('female')"
          (blur)="genderBlur.emit()"
        >
          <span class="goal__gender-icon" aria-hidden="true">
            ♀
          </span>
          <span class="goal__gender-content">
            <span class="goal__gender-title">
              Իգական
            </span>
            <span class="goal__gender-description">
              Կին
            </span>
          </span>
          <span
            class="goal__gender-check"
            [class.goal__gender-check--visible]="gender === 'female'"
            aria-hidden="true"
          >
            <svg viewBox="0 0 20 20" focusable="false">
              <path d="m5 10 3 3 7-7"></path>
            </svg>
          </span>
        </button>
      </div>
      <p
        class="goal__field-error"
        [class.goal__field-error--visible]="genderTouched && !genderValid"
        aria-live="polite"
      >
        {{ genderValid ? '&nbsp;' : 'Ընտրիր քո սեռը։' }}
      </p>
    </div>
    <div class="goal__privacy-note">
      <span class="goal__privacy-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      </span>
      <p>
        Քո տվյալները մեզ օգնում են ստեղծել քեզ համար ավելի համապատասխան
        ուսուցման փորձ։
      </p>
    </div>
  </div>
  <div class="goal__actions">
    <button
      type="button"
      class="goal__back"
      (click)="back.emit()"
    >
      <span aria-hidden="true">←</span>
      <span>Հետ</span>
    </button>
    <button
      type="button"
      class="goal__next button"
      [disabled]="!canContinue"
      (click)="onNext()"
    >
      <span>Շարունակել</span>
      <span aria-hidden="true">→</span>
    </button>
  </div>
</div>
<hy-app-footer></hy-app-footer>
