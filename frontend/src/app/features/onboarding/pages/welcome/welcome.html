<main class="welcome">
  <section class="welcome__content">
    <div class="welcome__logo">
      <img class="welcome__logo-image welcome__logo-image--light" src="/Logo.png" alt="HAYENG" />

      <img
        class="welcome__logo-image welcome__logo-image--dark"
        src="/Logo-dark.png"
        alt="HAYENG"
      />
    </div>

    <div class="welcome__text">
      <p class="welcome__eyebrow">ENGLISH · ARMENIAN</p>

      <h1>Բարի գալուստ</h1>

      <p class="welcome__subtitle">Welcome to HAYENG</p>

      <p class="welcome__description">
        Սովորիր անգլերեն քայլ առ քայլ՝ <br />
        հայերեն պարզ ու հասկանալի բացատրություններով և սովորիր միասին ուրիշների հետ։
      </p>
    </div>

    <button type="button" class="welcome__button" (click)="start()">Սկսել!</button>
  </section>
</main>
